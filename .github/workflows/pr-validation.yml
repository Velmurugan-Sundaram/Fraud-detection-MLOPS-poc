name: PR Validation - Code & Data Quality

on:
  pull_request:
    branches:
      - Mangesh_m1
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint flake8 black isort
      
      - name: Check Code Formatting (Black)
        run: |
          black --check src/ tests/ --line-length=120 || true
      
      - name: Check Import Sorting (isort)
        run: |
          isort --check-only src/ tests/ || true
      
      - name: Lint with Pylint
        run: |
          pylint src/ --exit-zero --max-line-length=120 --disable=all --enable=E,F
      
      - name: Lint with Flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --count --show-source --statistics || true
  
  test-coverage:
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run Tests with Coverage
        run: |
          export PYTHONPATH=${PYTHONPATH}:${PWD}
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term
      
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-report
          fail_ci_if_error: false
      
      - name: Upload HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
      
      - name: Comment PR with Coverage
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 60
          MINIMUM_ORANGE: 40
  
  data-validation:
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate Data Pipeline
        run: |
          python -c "
          import logging
          logging.basicConfig(level=logging.INFO)
          
          try:
              from src.ingestion.pipeline import DataIngestionPipeline
              from src.ingestion.validator import SchemaValidator
              import yaml
              
              with open('src/config/config.yaml', 'r') as f:
                  config = yaml.safe_load(f)
              
              print('Data ingestion pipeline validated')
              print('Schema validation working')
              print('Data pipeline configuration valid')
          except Exception as e:
              print(f' Data pipeline validation failed: {e}')
              raise
          "
  
