name: ML Pipeline CD - Deployment

on:
  workflow_run:
    workflows: ["ML Pipeline CI - Complete Workflow"]
    types:
      - completed
    branches:
      - Mangesh_m1

permissions:
  contents: read
  artifacts: read

jobs:
  deploy-check:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download CI Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "trained-models"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/models.zip', Buffer.from(download.data));
      
      - name: Extract Artifacts
        run: |
          unzip -o models.zip -d .
          ls -la models/
      
      - name: Validate Models
        run: |
          python -c "
          import os
          import json
          
          models_dir = 'models/'
          
          # Check models exist
          models = [f for f in os.listdir(models_dir) if f.endswith('.pkl')]
          print(f'✅ Found {len(models)} trained models:')
          for model in models:
              print(f'   - {model}')
          
          # Check metrics
          if os.path.exists('models/metrics.json'):
              with open('models/metrics.json', 'r') as f:
                  metrics = json.load(f)
              print(f'✅ Metrics available for {len(metrics)} models')
          
          # Check comparison report
          if os.path.exists('models/model_comparison_report.json'):
              print('✅ Model comparison report available')
          
          print('✅ Deployment validation successful')
          "
      
      - name: Generate Deployment Ready Status
        run: |
          echo "✅ DEPLOYMENT READY" > deployment_status.txt
          echo "Timestamp: $(date)" >> deployment_status.txt
          echo "Branch: ${{ github.ref }}" >> deployment_status.txt
          echo "Commit: ${{ github.sha }}" >> deployment_status.txt
      
      - name: Upload Deployment Status
        uses: actions/upload-artifact@v4
        with:
          name: deployment-status
          path: deployment_status.txt
  
  notify-success:
    needs: deploy-check
    runs-on: ubuntu-latest
    
    steps:
      - name: Success Notification
        run: |
          echo "╔════════════════════════════════════════════════════════╗"
          echo "║     ✅ ML PIPELINE CI/CD PIPELINE SUCCESSFUL ✅        ║"
          echo "║                                                        ║"
          echo "║  All stages completed successfully!                  ║"
          echo "║  Models are ready for deployment.                    ║"
          echo "║                                                        ║"
          echo "║  📊 Artifacts Generated:                              ║"
          echo "║     - Trained Models (PKL files)                      ║"
          echo "║     - Metrics (JSON)                                  ║"
          echo "║     - Model Comparison Report                         ║"
          echo "║     - Feature Consistency Report                      ║"
          echo "║     - Test Results & Coverage                         ║"
          echo "║                                                        ║"
          echo "║  🚀 Next Steps:                                       ║"
          echo "║     1. Review artifacts in Actions tab                ║"
          echo "║     2. Deploy to staging environment                  ║"
          echo "║     3. Run performance tests                          ║"
          echo "║     4. Merge to main when ready                       ║"
          echo "╚════════════════════════════════════════════════════════╝"
