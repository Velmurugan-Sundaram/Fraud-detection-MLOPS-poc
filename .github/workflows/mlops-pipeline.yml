name: MLOps Pipeline CI/CD

on:
  push:
    branches: [ "vel_m1" ]
  pull_request:
    branches: [ "vel_m1" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true  # Enable LFS to pull valid data if present

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run Pipeline
      run: |
        chmod +x run_pipeline.sh
        # Set Git config for MLflow/dvc interactions if needed
        git config --global user.email "ci@example.com"
        git config --global user.name "CI Runner"
        # Export MLflow to use local tracking for CI
        export MLFLOW_TRACKING_URI="file://$(pwd)/mlruns"
        ./run_pipeline.sh
        
    - name: Test with pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        pytest tests/
      
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-models-and-metrics
        path: |
          artifacts/
          mlruns/
        retention-days: 5

    - name: Pipeline Summary
      if: always()
      run: |
        echo "### 🚀 Pipeline & Build Completed!" >> $GITHUB_STEP_SUMMARY
        echo "The MLOps pipeline has successfully executed and artifacts are uploaded." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Local Deployment Endpoints" >> $GITHUB_STEP_SUMMARY
        echo "When you run \`docker compose up\`, access services here:" >> $GITHUB_STEP_SUMMARY
        echo "| Service | URL | Description |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|-----|-------------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🛡️ **Dashboard** | [http://localhost:8501](http://localhost:8501) | Main User Interface |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔮 **Inference API** | [http://localhost:8000](http://localhost:8000) | FastAPI Backend |" >> $GITHUB_STEP_SUMMARY
        echo "| 🧠 **MLflow UI** | [http://localhost:5000](http://localhost:5000) | Experiment Tracking |" >> $GITHUB_STEP_SUMMARY
        echo "| 📈 **Grafana** | [http://localhost:3000](http://localhost:3000) | Metrics Visualization |" >> $GITHUB_STEP_SUMMARY
        echo "| 🔢 **Prometheus** | [http://localhost:9090](http://localhost:9090) | Metric Scraper |" >> $GITHUB_STEP_SUMMARY
      
  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build and Push Pipeline
      uses: docker/build-push-action@v5
      with:
        context: .
        target: fraud-detection-pipeline
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/fraud-detection-pipeline:latest
        
    - name: Build and Push Dashboard
      uses: docker/build-push-action@v5
      with:
        context: .
        target: dashboard
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/fraud-detection-dashboard:latest
