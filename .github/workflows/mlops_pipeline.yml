name: MLOps Pipeline CI

on:
  push:
    branches: [ vel_m1 ]
  pull_request:
    branches: [ vel_m1 ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Use a service container for Postgres if needed for valid testing (optional for basic check)
      # mlflow-db:
      #   image: postgres:13
      #   env:
      #     POSTGRES_USER: mlflow
      #     POSTGRES_PASSWORD: password
      #     POSTGRES_DB: mlflow_db
      #   ports:
      #     - 5432:5432

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install evident separately if needed, but it should be in requirements
    
    - name: Run MLOps Pipeline
      env:
        # Set dummy credentials for testing if needed
        AWS_ACCESS_KEY_ID: testing
        AWS_SECRET_ACCESS_KEY: testing
        AWS_DEFAULT_REGION: us-east-1
      run: |
        # Make script executable
        chmod +x run_pipeline.sh
        
        # Modify pipeline script for CI (use python instead of ./venv/bin/python)
        # sed -i 's|./venv/bin/python|python|g' run_pipeline.sh
        # OR just create a venv
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        
        # Run the pipeline
        ./run_pipeline.sh

    - name: Verify Artifacts
      run: |
        ls -l artifacts/
        if [ ! -f "artifacts/drift_report.html" ]; then
          echo "Drift report missing!"
          exit 1
        fi

    - name: Build Docker Image
      run: |
        docker build -t fraud-detection-pipeline .
